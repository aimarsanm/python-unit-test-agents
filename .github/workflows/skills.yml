name: skills
on:
  pull_request:
    paths: ["skills/**"]
  push:
    branches: [main]
    paths: ["skills/**"]
permissions:
  contents: write
jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: python3 skills.py check --base origin/${{ github.base_ref }}
  index:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 skills.py index
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add index.json
          git diff --cached --quiet || (git commit -m "chore: update skills index" && git push)
